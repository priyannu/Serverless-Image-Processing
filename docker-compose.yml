services:

  localstack:
    container_name: localstack-image-pipeline

    image: localstack/localstack:latest

    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"

    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      - DEBUG=0
      - PERSISTENCE=1

    volumes:
      - "./.localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"